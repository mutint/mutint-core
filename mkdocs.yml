# `./aledb docs` builds this; `./aledb docs --serve` serves it with live reload.
#
# Not hosted anywhere. When it should be versioned, `mike` is the tool -- see
# docs/contributing/docs.md for the one addition that needs.

site_name: ALEdb
site_description: Using and extending ALEdb
# No site_url: nothing is hosted yet, and a wrong one makes the canonical links wrong.
repo_url: https://github.com/barricklab/aledb-core
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    # The nav is deep enough that the sections need to be navigable without expanding
    # everything, and long pages want their own contents.
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            # The whole reason for this toolchain: the docstrings in aledb_common are written
            # in markdown and are parsed as markdown here. Nothing about them changed to make
            # this work.
            docstring_style: null
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite

# Listed rather than inferred. An inferred nav quietly absorbs a page nobody linked and hides
# one that was deleted; this way both are a visible edit.
#
# The two top-level headings are not decoration. An assembled project merges every installed
# component's nav into one manual, and these headings are how a page says who it is for --
# `Using ALEdb` and `Extending ALEdb` from `aledb_common.docs_manual`. Anything filed under a
# heading that module does not recognise lands under "About this deployment" instead, named
# for this component, which is visible rather than silent.
nav:
  - Using ALEdb:
      - What ALEdb is: index.md
      - Quick start: using/quickstart.md
      - Loading data: using/loading-data.md
      - Importing VCF: using/importing-vcf.md
      - Reference genomes: using/reference-genomes.md
      - Configuration: using/configuration.md
      - Management commands: using/commands.md
  - Extending ALEdb:
      - Writing a plugin:
          - Overview: extending/index.md
          - Quickstart: plugin/quickstart.md
          - Repository structure: plugin/structure.md
          - The registries: plugin/registries.md
          - URLs, views and permissions: plugin/views-and-urls.md
          - Fitting into core's pages: plugin/integrating.md
          - The data model: plugin/data-model.md
          - Showing filtered data: plugin/filtering.md
          - Taking a file upload: plugin/staging.md
          - Work that takes minutes, or hours: plugin/background-jobs.md
          - Templates and static files: plugin/templates.md
          - Models and derived data: plugin/derived-data.md
          - Testing: plugin/testing.md
          - Packaging and installing: plugin/packaging.md
      - Reference:
          - plugin_registry: reference/plugin_registry.md
          - rebuild_registry: reference/rebuild_registry.md
          - nav_registry: reference/nav_registry.md
          - import_registry: reference/import_registry.md
          - about_registry: reference/about_registry.md
          - example_registry: reference/example_registry.md
          - context_registry: reference/context_registry.md
          - panel_registry: reference/panel_registry.md
      - Assembling a project: assembling/index.md
      - Contributing to these docs: contributing/docs.md
